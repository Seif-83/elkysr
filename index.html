<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القيصر للعطور - لوحة الأسعار</title>
    <!-- خط Cairo من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --dark: #1a1a1a;
            --light: #f4f4f4;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark);
            color: var(--white);
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 10px;
        }

        header h1 {
            color: var(--gold);
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        /* قسم البحث */
        .search-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        input, select {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--gold);
            background: #222;
            color: white;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        /* نتائج البحث */
        .result-card {
            background: var(--white);
            color: var(--dark);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            display: none;
            animation: fadeIn 0.5s;
        }

        .result-card h2 {
            color: #888;
            font-size: 1rem;
        }

        .result-card .price {
            font-size: 3rem;
            font-weight: 900;
            color: var(--gold);
        }

        .result-card .currency {
            font-size: 1.2rem;
        }

        .result-card .details {
            margin-top: 18px;
            display: grid;
            gap: 10px;
            text-align: right;
        }

        .result-card .detail-item {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 10px 14px;
            border: 1px solid #e7d27d;
            font-size: 0.95rem;
            line-height: 1.8;
        }

        .result-card .detail-item strong {
            color: #2b2b2b;
        }

        /* لوحة التحكم */
        .admin-panel {
            margin-top: 50px;
            border-top: 1px dashed var(--gold);
            padding-top: 20px;
        }

        .admin-btn {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
            font-weight: bold;
        }

        .admin-content {
            display: none;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .add-btn {
            background: var(--gold);
            color: var(--dark);
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* جدول العطور المضافة */
        .stock-search {
            width: 100%;
            margin-bottom: 15px;
            background: #111;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            color: white;
            padding: 12px 14px;
            font-size: 1rem;
        }

        .table-wrap {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            margin-top: 10px;
        }

        .perfume-list {
            margin-top: 0;
            width: 100%;
            min-width: 520px;
            border-collapse: collapse;
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .perfume-list th, .perfume-list td {
            padding: 12px 10px;
            border-bottom: 1px solid #2d2d2d;
            text-align: right;
            vertical-align: middle;
            white-space: nowrap;
        }

        .perfume-list thead th {
            background: #0d0d0d;
            color: var(--gold);
            font-size: 0.9rem;
            font-weight: 700;
        }

        .perfume-list tbody tr {
            background: #181818;
        }

        .perfume-list tbody tr:nth-child(even) {
            background: #121212;
        }

        .table-actions {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-btn, .delete-btn {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 1.05rem;
            font-weight: 700;
            background: transparent;
            color: var(--white);
            transition: all 0.2s ease;
            min-width: 88px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .edit-btn {
            color: #7cb4ff;
            border: 1px solid rgba(124, 180, 255, 0.5);
            background: rgba(124, 180, 255, 0.08);
        }

        .delete-btn {
            color: #ff7a7a;
            border: 1px solid rgba(255, 122, 122, 0.5);
            background: rgba(255, 122, 122, 0.08);
        }

        .edit-btn:hover, .delete-btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
        }

        .edit-btn {
            color: #2d7ef7;
        }

        .delete-btn {
            color: #ff4d4d;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 20;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            width: min(90%, 480px);
            background: #1d1d1d;
            border: 1px solid var(--gold);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--white);
            font-size: 1.8rem;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .container {
                max-width: 100%;
            }

            header h1 {
                font-size: 2rem;
            }

            .search-section,
            .admin-content {
                padding: 14px;
            }

            .perfume-list th,
            .perfume-list td {
                padding: 10px 8px;
                font-size: 0.8rem;
            }

            .edit-btn,
            .delete-btn {
                min-width: 74px;
                padding: 7px 8px;
                font-size: 0.8rem;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>القيصر للعطور</h1>
        <p>دليل سعر الجرام الذكي</p>
    </header>

    <!-- قسم البحث -->
    <div class="search-section">
        <input type="text" id="searchInput" placeholder="اكتب اسم العطر هنا..." oninput="searchPerfume()">
        <div id="resultCard" class="result-card">
            <h2 id="resName">اسم العطر</h2>
            <div class="price" id="resPrice">0</div>
            <div class="currency">جنيه مصري للجرام</div>
            <div class="details">
                <div class="detail-item"><strong>الصف:</strong> <span id="resRow">-</span></div>
                <div class="detail-item"><strong>النوع:</strong> <span id="resType">-</span></div>
            </div>
        </div>
    </div>

    <!-- لوحة التحكم -->
    <div class="admin-panel">
        <button class="admin-btn" onclick="toggleAdmin()">⚙️ لوحة التحكم (إضافة عطور)</button>
        
        <div id="adminContent" class="admin-content">
            <h3>إضافة عطر جديد</h3>
            <div class="form-group">
                <input type="text" id="newName" placeholder="اسم العطر">
                <input type="number" id="newPrice" placeholder="سعر الجرام" min="1">
                <select id="newRow">
                    <option value="">اختر رقم الصف</option>
                    <option value="1">الصف 1</option>
                    <option value="2">الصف 2</option>
                    <option value="3">الصف 3</option>
                    <option value="4">الصف 4</option>
                </select>
                <select id="newType" onchange="toggleWesternSubtype()">
                    <option value="">اختر نوع العطر</option>
                    <option value="شرقي">شرقي</option>
                    <option value="غربي">غربي</option>
                </select>
                <select id="newWesternSubtype" style="display: none;">
                    <option value="رجالي">رجالي</option>
                    <option value="حريمي">حريمي</option>
                </select>
                <button class="add-btn" onclick="addPerfume()">إضافة للمخزن</button>
            </div>

            <input type="text" id="stockSearchInput" class="stock-search" placeholder="ابحث في المخزن..." oninput="filterStockProducts()">

            <div class="table-wrap">
                <table class="perfume-list">
                    <thead>
                        <tr>
                            <th>العطر</th>
                            <th>السعر</th>
                            <th>الصف</th>
                            <th>النوع</th>
                            <th>تعديل</th>
                            <th>حذف</th>
                        </tr>
                    </thead>
                    <tbody id="perfumeTableBody">
                        <!-- هيتم ملي البيانات بالـ JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="editModal" class="modal" aria-hidden="true">
    <div class="modal-card">
        <div class="modal-header">
            <h3>تعديل العطر</h3>
            <button class="modal-close" onclick="closeEditModal()" aria-label="إغلاق">×</button>
        </div>

        <input type="hidden" id="editPerfumeId">
        <input type="text" id="editName" placeholder="اسم العطر">
        <input type="number" id="editPrice" placeholder="سعر الجرام" min="1">
        <select id="editRow">
            <option value="">اختر رقم الصف</option>
            <option value="1">الصف 1</option>
            <option value="2">الصف 2</option>
            <option value="3">الصف 3</option>
            <option value="4">الصف 4</option>
        </select>
        <select id="editType" onchange="toggleEditWesternSubtype()">
            <option value="">اختر نوع العطر</option>
            <option value="شرقي">شرقي</option>
            <option value="غربي">غربي</option>
        </select>
        <select id="editWesternSubtype" style="display: none;">
            <option value="رجالي">رجالي</option>
            <option value="حريمي">حريمي</option>
        </select>
        <button class="add-btn" onclick="saveEditedPerfume()">حفظ التعديلات</button>
    </div>
</div>

<script type="module">
    const STORAGE_KEY = 'al-qaisar-data';
    const DEFAULT_PERFUMES = [{
        id: 'default-1',
        name: 'غربي (رجالي/حريمي)',
        price: 13,
        row: 1,
        type: 'غربي',
        westernSubtype: 'رجالي'
    }];

    const firebaseConfig = {
        apiKey: 'AIzaSyCjHvlBoEoWW7z1Dc4C1BC1vDmAk1UDPQo',
        authDomain: 'elkysr-130fe.firebaseapp.com',
        databaseURL: 'https://elkysr-130fe-default-rtdb.firebaseio.com',
        projectId: 'elkysr-130fe',
        storageBucket: 'elkysr-130fe.firebasestorage.app',
        messagingSenderId: '1077458699020',
        appId: '1:1077458699020:web:3da0f9ae7782a55f197f29',
        measurementId: 'G-DTQ3SK6178'
    };

    const isFirebaseConfigured = !!firebaseConfig.apiKey &&
        !firebaseConfig.apiKey.includes('YOUR_') &&
        !!firebaseConfig.databaseURL &&
        !firebaseConfig.databaseURL.includes('YOUR_');

    let db = null;
    let perfumes = [];

    function generateId() {
        if (window.crypto && crypto.randomUUID) {
            return crypto.randomUUID();
        }
        return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function normalizePerfume(item, fallbackId = null) {
        if (!item || typeof item !== 'object') return null;

        const name = String(item.name || '').trim();
        const price = Number(item.price);
        const row = Number(item.row) || 1;
        const type = String(item.type || 'غربي').trim();
        const westernSubtype = String(item.westernSubtype || '').trim();

        if (!name || Number.isNaN(price)) return null;

        return {
            id: item.id || fallbackId || generateId(),
            name,
            price,
            row: [1, 2, 3, 4].includes(row) ? row : 1,
            type: ['شرقي', 'غربي'].includes(type) ? type : 'غربي',
            westernSubtype: ['رجالي', 'حريمي'].includes(westernSubtype) ? westernSubtype : ''
        };
    }

    function getTypeLabel(perfume) {
        if (perfume.type === 'غربي') {
            return perfume.westernSubtype ? `غربي / ${perfume.westernSubtype}` : 'غربي';
        }
        return 'شرقي';
    }

    function getRowLabel(perfume) {
        return `الصف ${perfume.row || 1}`;
    }

    function getStoredPerfumes() {
        const candidates = [
            () => localStorage.getItem(STORAGE_KEY),
            () => sessionStorage.getItem(STORAGE_KEY)
        ];

        for (const getValue of candidates) {
            try {
                const raw = getValue();
                if (!raw) continue;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) {
                    const normalized = parsed
                        .map(item => normalizePerfume(item))
                        .filter(Boolean);

                    if (normalized.length > 0) return normalized;
                }
            } catch (error) {
                console.warn('Could not parse stored perfumes:', error);
            }
        }

        return DEFAULT_PERFUMES;
    }

    function saveLocalBackup(data) {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (error) {
            console.warn('localStorage unavailable:', error);
        }

        try {
            sessionStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (error) {
            console.warn('sessionStorage unavailable:', error);
        }
    }

    function setProducts(data) {
        perfumes = data
            .map(item => normalizePerfume(item))
            .filter(Boolean);

        if (perfumes.length === 0) {
            perfumes = DEFAULT_PERFUMES;
        }

        saveLocalBackup(perfumes);
        renderTable();
    }

    async function initFirebase() {
        if (!isFirebaseConfigured) {
            return false;
        }

        try {
            const [{ initializeApp }, { getDatabase, ref, set, remove, onValue }] = await Promise.all([
                import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
                import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js')
            ]);

            const app = initializeApp(firebaseConfig);
            db = getDatabase(app);

            const perfumesRef = ref(db, 'perfumes');
            onValue(perfumesRef, (snapshot) => {
                const data = snapshot.val() || {};
                const firebaseProducts = Object.entries(data).map(([id, item]) => normalizePerfume({ ...item, id }, id));
                setProducts(firebaseProducts.filter(Boolean));
            });

            return true;
        } catch (error) {
            console.warn('Firebase connection failed, using local storage fallback:', error);
            db = null;
            return false;
        }
    }

    function searchPerfume() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultCard = document.getElementById('resultCard');
        const resName = document.getElementById('resName');
        const resPrice = document.getElementById('resPrice');
        const resRow = document.getElementById('resRow');
        const resType = document.getElementById('resType');

        if (query.length > 0) {
            const found = perfumes.find(p => p.name.toLowerCase().includes(query));

            if (found) {
                resName.innerText = found.name;
                resPrice.innerText = found.price;
                resRow.innerText = getRowLabel(found);
                resType.innerText = getTypeLabel(found);
                resultCard.style.display = 'block';
            } else {
                resultCard.style.display = 'none';
            }
        } else {
            resultCard.style.display = 'none';
        }
    }

    function toggleAdmin() {
        const content = document.getElementById('adminContent');
        content.style.display = content.style.display === 'block' ? 'none' : 'block';
        renderTable();
    }

    function syncTypeFields(typeFieldId, subtypeFieldId, priceFieldId, defaultPrice = 13, preservePrice = false) {
        const typeValue = document.getElementById(typeFieldId).value;
        const westSubtype = document.getElementById(subtypeFieldId);
        const priceInput = document.getElementById(priceFieldId);

        westSubtype.style.display = typeValue === 'غربي' ? 'block' : 'none';

        if (typeValue === 'غربي') {
            priceInput.value = defaultPrice;
            priceInput.setAttribute('readonly', 'true');
        } else {
            priceInput.removeAttribute('readonly');
            if (!preservePrice || !priceInput.value || Number(priceInput.value) === defaultPrice) {
                priceInput.value = '';
            }
        }
    }

    function toggleWesternSubtype() {
        syncTypeFields('newType', 'newWesternSubtype', 'newPrice', 13, false);
    }

    function toggleEditWesternSubtype() {
        syncTypeFields('editType', 'editWesternSubtype', 'editPrice', 13, true);
    }

    function openEditModal(perfume) {
        document.getElementById('editPerfumeId').value = perfume.id;
        document.getElementById('editName').value = perfume.name;
        document.getElementById('editPrice').value = perfume.price;
        document.getElementById('editRow').value = String(perfume.row || 1);
        document.getElementById('editType').value = perfume.type;
        document.getElementById('editWesternSubtype').value = perfume.westernSubtype || 'رجالي';
        syncTypeFields('editType', 'editWesternSubtype', 'editPrice', 13, true);
        document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    window.searchPerfume = searchPerfume;
    window.toggleAdmin = toggleAdmin;
    window.toggleWesternSubtype = toggleWesternSubtype;
    window.toggleEditWesternSubtype = toggleEditWesternSubtype;
    window.openEditModal = openEditModal;
    window.closeEditModal = closeEditModal;
    window.renderTable = renderTable;

    async function addPerfume() {
        const name = document.getElementById('newName').value.trim();
        const priceValue = document.getElementById('newPrice').value;
        const type = document.getElementById('newType').value;
        const price = type === 'غربي' ? 13 : Number(priceValue);
        const row = Number(document.getElementById('newRow').value);
        const westernSubtype = type === 'غربي' ? document.getElementById('newWesternSubtype').value : '';

        if (!name || Number.isNaN(price) || price <= 0 || !row || !type) {
            alert('يرجى كتابة الاسم والسعر والصف ونوع العطر');
            return;
        }

        const isDuplicateName = perfumes.some(item =>
            item.name.trim().toLowerCase() === name.toLowerCase()
        );

        if (isDuplicateName) {
            alert('هذا الاسم موجود بالفعل في المخزن، يرجى اختيار اسم مختلف.');
            return;
        }

        const newPerfume = {
            id: generateId(),
            name,
            price,
            row: [1, 2, 3, 4].includes(row) ? row : 1,
            type,
            westernSubtype
        };

        if (db) {
            try {
                const { ref: dbRef, set } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
                await set(dbRef(db, `perfumes/${newPerfume.id}`), newPerfume);
                alert('تمت إضافة العطر بنجاح!');
            } catch (error) {
                console.error('Failed to save to Firebase:', error);
                alert('فشل الحفظ في Firebase، تم حفظه محلياً فقط.');
                perfumes.push(newPerfume);
                saveLocalBackup(perfumes);
                renderTable();
            }
        } else {
            perfumes.push(newPerfume);
            saveLocalBackup(perfumes);
        }

        document.getElementById('newName').value = '';
        document.getElementById('newPrice').value = '';
        document.getElementById('newRow').value = '';
        document.getElementById('newType').value = '';
        document.getElementById('newWesternSubtype').style.display = 'none';
        document.getElementById('newWesternSubtype').value = 'رجالي';
        renderTable();
    }

    window.addPerfume = addPerfume;

    async function saveEditedPerfume() {
        const id = document.getElementById('editPerfumeId').value;
        const name = document.getElementById('editName').value.trim();
        const priceValue = document.getElementById('editPrice').value;
        const type = document.getElementById('editType').value;
        const price = type === 'غربي' ? 13 : Number(priceValue);
        const row = Number(document.getElementById('editRow').value);
        const westernSubtype = type === 'غربي' ? document.getElementById('editWesternSubtype').value : '';

        if (!id || !name || Number.isNaN(price) || price <= 0 || !row || !type) {
            alert('يرجى التحقق من الاسم والسعر والصف ونوع العطر');
            return;
        }

        const updatedPerfume = {
            id,
            name,
            price,
            row: [1, 2, 3, 4].includes(row) ? row : 1,
            type,
            westernSubtype
        };

        if (db) {
            try {
                const { ref: dbRef, set } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
                await set(dbRef(db, `perfumes/${id}`), updatedPerfume);
            } catch (error) {
                console.error('Failed to update Firebase:', error);
                alert('فشل تحديث Firebase، تم الحفظ محلياً فقط.');
                perfumes = perfumes.map(item => item.id === id ? updatedPerfume : item);
                saveLocalBackup(perfumes);
                renderTable();
                closeEditModal();
                return;
            }
        } else {
            perfumes = perfumes.map(item => item.id === id ? updatedPerfume : item);
            saveLocalBackup(perfumes);
        }

        if (!db) {
            const index = perfumes.findIndex(item => item.id === id);
            if (index !== -1) {
                perfumes[index] = updatedPerfume;
            }
            saveLocalBackup(perfumes);
        }

        closeEditModal();
        renderTable();
    }

    window.saveEditedPerfume = saveEditedPerfume;

    async function deletePerfume(id) {
        if (!confirm('هل تريد مسح هذا العطر؟')) return;

        if (db) {
            try {
                const { ref: dbRef, remove } = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js');
                await remove(dbRef(db, `perfumes/${id}`));
                return;
            } catch (error) {
                console.error('Failed to delete from Firebase:', error);
            }
        }

        perfumes = perfumes.filter(item => item.id !== id);
        saveLocalBackup(perfumes);
        renderTable();
    }

    window.deletePerfume = deletePerfume;

    function getVisiblePerfumes() {
        const queryEl = document.getElementById('stockSearchInput');
        const query = queryEl ? queryEl.value.trim().toLowerCase() : '';

        if (!query) {
            return perfumes;
        }

        return perfumes.filter((p) => {
            const searchableText = [
                p.name,
                getTypeLabel(p),
                String(p.row || 1),
                String(p.price),
                p.westernSubtype || ''
            ].join(' ').toLowerCase();

            return searchableText.includes(query);
        });
    }

    function filterStockProducts() {
        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('perfumeTableBody');
        tbody.innerHTML = '';

        const visiblePerfumes = getVisiblePerfumes();

        if (visiblePerfumes.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center; color:#d4af37; padding:20px;">لا توجد نتائج</td>
                </tr>
            `;
            return;
        }

        visiblePerfumes.forEach((p) => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price} ج</td>
                    <td>${p.row || 1}</td>
                    <td>${getTypeLabel(p)}</td>
                    <td>
                        <div class="table-actions">
                            <button class="edit-btn" onclick='openEditModal(${JSON.stringify(p)})' title="تعديل">✏️ تعديل</button>
                        </div>
                    </td>
                    <td>
                        <div class="table-actions">
                            <button class="delete-btn" onclick="deletePerfume('${p.id}')" title="حذف">❌ حذف</button>
                        </div>
                    </td>
                </tr>
            `;
        });
    }

    window.filterStockProducts = filterStockProducts;

    async function startApp() {
        perfumes = getStoredPerfumes();
        renderTable();
        await initFirebase();

        if (!db) {
            setProducts(perfumes);
        }
    }

    window.addEventListener('DOMContentLoaded', startApp);
</script>

</body>
</html>
